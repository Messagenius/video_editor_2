name: video_editor_2
description: |
  A flutter package for editing video with fully customizable UI.
  Supports crop, trim, rotation and cover selection.
version: 3.1.1
repository: https://github.com/Alberto-Monteiro/video_editor
homepage: null
publish_to: none

environment:
  sdk: ^3.4.3
  flutter: ">=1.17.0"

dependencies:
  cross_file: ^0.3.4+2
  flutter:
    sdk: flutter
  get_thumbnail_video: 
    git: 
      url: https://github.com/Messagenius/get_video_thumbnail.git
      ref: f6247831bb0e2ee61e6a73b8a9f91dfb24300e2f
    # path: ../get_video_thumbnail
  transparent_image: ^2.0.1
  video_player: ^2.9.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

screenshots:
  - description: 'Video editor demo'
    path: assets/demo_thumb.webp
